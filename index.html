<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trackMyPESO</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
    <h1>💰 trackMyPESO</h1>

    <button id="darkModeBtn">
        🌙 Dark Mode
    </button>
</header>

<!-- PROFILE SECTION -->

<div class="profile-card">

    <input
        type="text"
        id="nicknameInput"
        placeholder="Enter your nickname">

    <button id="saveNicknameBtn">
        Save Nickname
    </button>

</div>

<!-- GREETING -->

<div class="greeting-card">

    <h2 id="greetingText">
        Welcome to trackMyPESO! 👋
    </h2>

</div>

<!-- DASHBOARD -->

<div class="dashboard">

    <div class="card">
        <h3>💵 Income</h3>
        <p id="totalIncome">₱0</p>
    </div>

    <div class="card">
        <h3>💸 Expenses</h3>
        <p id="totalExpenses">₱0</p>
    </div>

    <div class="card">
        <h3>💰 Remaining</h3>
        <p id="remainingBalance">₱0</p>
    </div>

</div>

<div class="container">

    <!-- INCOME -->

    <h2>Add Income</h2>

    <input
        type="text"
        id="incomeSource"
        placeholder="Income Source">

    <input
        type="number"
        id="incomeAmount"
        placeholder="Amount">

    <button id="addIncomeBtn">
        Add Income
    </button>

    <hr>

    <!-- EXPENSE -->

    <h2>Add Expense</h2>

    <input
        type="text"
        id="expenseName"
        placeholder="Expense Name">

    <input
        type="number"
        id="expenseAmount"
        placeholder="Amount">

    <select id="category">

        <option value="Food">
            🍔 Food
        </option>

        <option value="Transport">
            🚌 Transport
        </option>

        <option value="Bills">
            💡 Bills
        </option>

        <option value="Shopping">
            🛒 Shopping
        </option>

        <option value="Entertainment">
            🎮 Entertainment
        </option>

        <option value="Other">
            📦 Other
        </option>

    </select>

    <button id="addExpenseBtn">
        Add Expense
    </button>

    <hr>

    <!-- SEARCH -->

    <h2>Search Expenses</h2>

    <input
        type="text"
        id="searchInput"
        placeholder="Search expense...">

    <!-- HISTORY -->

    <h2>Expense History</h2>

    <ul id="expenseList"></ul>

</div>

<!-- CHARTS -->

<div class="charts">

    <div class="chart-card">

        <h2>Category Breakdown</h2>

        <canvas id="expenseChart"></canvas>

    </div>

    <div class="chart-card">

        <h2>Monthly Expenses</h2>

        <canvas id="monthlyChart"></canvas>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
